<div class="comments">
    {{ if .Site.Params.remark42 }}
        <div id="remark42"></div>
        <script>
            themeFromLS = localStorage.getItem("theme")
            themeFromHugo = document.body.classList.contains("dark-theme") ? "dark" : "light"
            currentTheme = themeFromLS ? themeFromLS : themeFromHugo;

            var remark_config = {
                host: {{ site.Params.remark42_host }},
                site_id: {{ site.Params.remark42_site_id }},
                theme: currentTheme,
                max_shown_comments: 100,
            }
        </script>
        <script>!function(e,n){for(var o=0;o<e.length;o++){var r=n.createElement("script"),c=".js",d=n.head||n.body;"noModule"in r?(r.type="module",c=".mjs"):r.async=!0,r.defer=!0,r.src=remark_config.host+"/web/"+e[o]+c,d.appendChild(r)}}(remark_config.components||["embed"],document);</script>
    {{ else if .Site.Params.giscus }}
        <div id="giscus-container"></div>
        <script>
        (function() {
            const themeFromLS = localStorage.getItem("theme");
            const themeFromHugo = document.body.classList.contains("dark-theme") ? "dark" : "light";
            const currentTheme = themeFromLS ? themeFromLS : themeFromHugo;

            const script = document.createElement("script");
            script.src = "https://giscus.app/client.js";
            script.setAttribute("data-repo", {{ .Site.Params.giscus_repo }});
            script.setAttribute("data-repo-id", {{ .Site.Params.giscus_repo_id }});
            script.setAttribute("data-category", {{ .Site.Params.giscus_category }});
            script.setAttribute("data-category-id", {{ .Site.Params.giscus_category_id }});
            script.setAttribute("data-mapping", {{ .Site.Params.giscus_mapping | default "pathname" }});
            script.setAttribute("data-strict", "0");
            script.setAttribute("data-reactions-enabled", "1");
            script.setAttribute("data-emit-metadata", "0");
            script.setAttribute("data-input-position", "bottom");
            script.setAttribute("data-theme", currentTheme);
            script.setAttribute("data-lang", "en");
            script.setAttribute("crossorigin", "anonymous");
            script.async = true;
            document.getElementById("giscus-container").appendChild(script);
        })();
        </script>
    {{ else if .Site.Config.Services.Disqus.Shortname }}
        {{ template "_internal/disqus.html" . }}
    {{ end }}
</div>
