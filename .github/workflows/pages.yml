name: Deploy static site to GitHub Pages
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # If you use Hugo instead, enable this block and remove the Node block above:
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.126.3'
          extended: true
      - name: Build
        run: hugo --minify  # writes to `public/`

      - name: Prepare Pages artifact
        run: |
          OUTDIR=$( [ -d dist ] && echo dist || echo public )
          echo "Using output dir: $OUTDIR"
          mkdir -p "$OUTDIR"
          # Ensure CNAME file for custom domain:
          echo "tkdlabs.com" > "$OUTDIR/CNAME"
        shell: bash

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ github.workspace }}/dist
        if: ${{ hashFiles('dist/**') != '' }}

      - name: Upload artifact (fallback to public/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ github.workspace }}/public
        if: ${{ hashFiles('dist/**') == '' }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
